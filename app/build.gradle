plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'lk.tgcompany.stylesync_admin'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "lk.tgcompany.stylesync_admin"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    dependencies {
        implementation 'com.google.firebase:firebase-firestore:24.10.0'
        implementation 'com.google.firebase:firebase-auth:22.3.0'
        // Other standard UI libraries
    }
    implementation(platform("com.google.firebase:firebase-bom:34.9.0"))
    implementation("com.google.firebase:firebase-analytics")

    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database' // For Real-time Chat
    implementation 'com.google.firebase:firebase-storage'  // To upload profile pics
    // Firebase Messaging (FCM)
    implementation 'com.google.firebase:firebase-messaging:23.4.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}